<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>T2 Évasion des 24h — Manuel du logement</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bleu:#2E4A6B;--bleu-pale:#E8EEF5;
  --sauge:#8BA88A;--sauge-pale:#EAF0E8;
  --moutarde:#C8881A;--moutarde-pale:#F5E8D0;
  --craie:#F5F3EF;--texte:#2C2C2A;--texte-s:#5F5E5A;--texte-t:#888780;
  --bord:rgba(0,0,0,0.10);--bg:#fff;--bg-s:#F8F7F4;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:var(--craie);color:var(--texte);}
.page{max-width:480px;margin:0 auto;padding:16px 14px 48px;}

/* LANG SCREEN */
#lang-screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:2rem 1rem;}
.lang-logo{width:72px;height:72px;background:var(--sauge-pale);border-radius:16px;display:flex;align-items:center;justify-content:center;}
.lang-title{font-size:22px;font-weight:600;color:var(--texte);text-align:center;}
.lang-sub{font-size:12px;color:var(--texte-s);text-align:center;}
.lang-btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;}
.lang-btn{display:flex;align-items:center;gap:12px;background:var(--bg);border:1.5px solid var(--bord);border-radius:14px;padding:14px 22px;cursor:pointer;min-width:150px;transition:all 0.12s;}
.lang-btn:hover{border-color:var(--bleu);background:var(--bleu-pale);}
.lang-flag{font-size:26px;}
.lang-name{font-size:14px;font-weight:600;color:var(--texte);}
.lang-native{font-size:11px;color:var(--texte-s);}

#app{display:none;}

/* HEADER */
.header{background:var(--bleu);border-radius:16px;padding:20px 20px 18px;margin-bottom:12px;display:flex;align-items:center;gap:14px;}
.logo-mark{width:50px;height:50px;background:var(--sauge-pale);border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.header-title{font-size:19px;font-weight:600;color:#F5F3EF;line-height:1.2;}
.header-sub{font-size:11px;color:var(--sauge);margin-top:4px;}
.lang-sw{margin-left:auto;background:rgba(255,255,255,0.15);border:0.5px solid rgba(255,255,255,0.25);border-radius:8px;padding:6px 10px;cursor:pointer;font-size:11px;color:#F5F3EF;display:flex;align-items:center;gap:4px;flex-shrink:0;}

/* RULES */
.rules{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;}
.rule-pill{background:var(--bg);border:1px solid var(--bord);border-radius:20px;padding:5px 11px;font-size:11px;color:var(--texte-s);display:flex;align-items:center;gap:5px;}
.rule-pill i{font-size:13px;color:var(--bleu);}

/* NAV */
.nav{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:13px;}
.nav-btn{background:var(--bg);border:1px solid var(--bord);border-radius:13px;padding:13px 6px 11px;cursor:pointer;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;transition:all 0.12s;-webkit-tap-highlight-color:transparent;}
.nav-btn:hover{background:var(--sauge-pale);border-color:var(--sauge);}
.nav-btn.active{background:var(--bleu);border-color:var(--bleu);}
.nav-btn .nb-wrap{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;background:var(--bleu-pale);transition:background 0.12s;}
.nav-btn.active .nb-wrap{background:rgba(255,255,255,0.2);}
.nb-icon{font-size:20px;color:var(--bleu);transition:color 0.12s;}
.nav-btn.active .nb-icon,.nav-btn.active .nb-label{color:#F5F3EF;}
.nb-label{font-size:10px;font-weight:600;color:var(--texte);transition:color 0.12s;line-height:1.2;}

/* PANELS */
.panel{display:none;}
.panel.active{display:block;animation:fadeIn 0.18s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}

/* CARD */
.card{background:var(--bg);border:1px solid var(--bord);border-radius:14px;padding:15px 17px;margin-bottom:10px;}
.card-title{font-size:14px;font-weight:600;color:var(--texte);margin-bottom:11px;display:flex;align-items:center;gap:8px;}
.card-title i{font-size:17px;color:var(--bleu);}
.card p,.card li{font-size:13px;color:var(--texte-s);line-height:1.7;}
.card ul{padding-left:16px;}
.card ul li{margin-bottom:4px;}

/* BOXES */
.hl{background:var(--sauge-pale);border:1px solid #B8CEB6;border-radius:10px;padding:10px 13px;margin-top:10px;}
.hl p{font-size:12px;color:#3A5438;}
.warn{background:var(--moutarde-pale);border:1px solid #DDB87A;border-radius:10px;padding:10px 13px;margin-top:10px;}
.warn p{font-size:12px;color:#7A4A10;}
.code-box{background:var(--bg-s);border:1px solid #D0CCC6;border-radius:10px;padding:11px 13px;font-family:'SF Mono','Fira Code',monospace;font-size:15px;color:var(--bleu);letter-spacing:1.5px;word-break:break-all;margin:6px 0;user-select:all;}

/* STEP */
.step{display:flex;gap:11px;align-items:flex-start;margin-bottom:11px;}
.step-n{width:24px;height:24px;border-radius:50%;background:var(--bleu);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;}
.step strong{font-size:13px;font-weight:600;color:var(--texte);display:block;margin-bottom:2px;}
.step span{font-size:13px;color:var(--texte-s);line-height:1.6;}

/* URGENCES */
.urg-card{background:#FDF0F0;border:1px solid #EBC8C8;border-radius:14px;padding:13px 17px;margin-bottom:10px;display:flex;align-items:center;gap:16px;}
.urg-num{font-size:32px;font-weight:700;color:#8B1F1F;min-width:56px;}
.urg-label{font-size:14px;font-weight:600;color:#5A1414;}
.urg-sub{font-size:12px;color:#A05050;margin-top:2px;}

/* LINKS */
.link-row{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px;}
.ext-link{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--bleu);border:1px solid #B8C8DC;border-radius:8px;padding:6px 11px;background:var(--bleu-pale);text-decoration:none;}

/* TRAM */
.tram-card{background:var(--bleu-pale);border:1px solid #C0D0E0;border-radius:12px;padding:13px 15px;margin-bottom:10px;}
.tram-title{font-size:13px;font-weight:600;color:var(--bleu);margin-bottom:8px;}
.tram-step{font-size:13px;color:var(--texte-s);margin-bottom:5px;line-height:1.5;}
.tram-time{display:inline-block;background:var(--bleu);color:#fff;font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;margin-left:6px;}

/* PARKING */
.park-free{background:var(--sauge-pale);border:1px solid #B8CEB6;border-radius:10px;padding:10px 13px;margin-bottom:8px;}
.park-paid{background:var(--bleu-pale);border:1px solid #B8C8DC;border-radius:10px;padding:10px 13px;margin-bottom:8px;}

/* SHOP */
.shop-card{background:var(--bg);border:1px solid var(--bord);border-radius:14px;padding:15px 17px;margin-bottom:10px;}
.shop-head{display:flex;align-items:flex-start;gap:12px;margin-bottom:8px;}
.shop-photo{width:72px;height:72px;border-radius:8px;object-fit:cover;flex-shrink:0;}
.shop-name{font-size:14px;font-weight:600;color:var(--texte);}
.shop-dist{display:inline-block;background:var(--sauge-pale);color:#3A5438;font-size:10px;font-weight:600;padding:2px 7px;border-radius:10px;margin-left:5px;}
.shop-addr{font-size:11px;color:var(--texte-t);margin:3px 0;}
.shop-desc{font-size:12px;color:var(--texte-s);margin-bottom:8px;}
.hours-table{width:100%;font-size:12px;border-collapse:collapse;}
.hours-table td{padding:4px 0;color:var(--texte-s);border-bottom:1px solid var(--bord);}
.hours-table tr:last-child td{border-bottom:none;}
.hours-table td:last-child{text-align:right;color:var(--texte);font-weight:500;}
.hours-table tr.closed td{opacity:0.4;}

/* MARCHE */
.marche-card{background:var(--sauge-pale);border:1px solid #B8CEB6;border-radius:14px;padding:13px 17px;margin-bottom:10px;display:flex;align-items:center;gap:12px;}
.marche-card i{font-size:22px;color:var(--sauge);flex-shrink:0;}

/* RESTO */
.resto-card{background:var(--bg);border:1px solid var(--bord);border-radius:14px;padding:15px 17px;margin-bottom:10px;}
.resto-head{display:flex;align-items:flex-start;gap:12px;margin-bottom:6px;}
.resto-icon{width:44px;height:44px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:22px;}
.resto-name{font-size:13px;font-weight:600;color:var(--texte);}
.resto-badge{display:inline-flex;align-items:center;gap:3px;background:#FDF0E8;color:#8B3A0A;font-size:10px;font-weight:600;padding:2px 7px;border-radius:10px;margin-left:5px;}
.resto-type{font-size:10px;font-weight:600;padding:2px 7px;border-radius:10px;margin:3px 0;display:inline-block;}
.resto-addr{font-size:11px;color:var(--texte-t);margin:3px 0 5px;}
.resto-desc{font-size:12px;color:var(--texte-s);line-height:1.55;}

/* PLACE */
.place-row{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--bord);}
.place-row:last-child{border-bottom:none;padding-bottom:0;}
.place-icon{font-size:20px;color:var(--sauge);flex-shrink:0;margin-top:1px;}
.place-name{font-size:13px;font-weight:600;color:var(--texte);}
.place-desc{font-size:12px;color:var(--texte-s);margin-top:2px;line-height:1.55;}
.place-addr{font-size:11px;color:var(--texte-t);margin-top:1px;}

/* PHOTO PAIR */
.photo-pair{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0 16px;}
.photo-item{border-radius:10px;overflow:hidden;border:1px solid var(--bord);}
.photo-item img{width:100%;display:block;object-fit:cover;height:155px;}
.photo-caption{padding:8px 8px 10px;background:var(--bg-s);font-size:12px;font-weight:600;color:var(--texte-s);text-align:center;}

/* QR */
.qr-block{display:flex;gap:14px;align-items:center;margin-top:12px;background:var(--bg-s);border:1px solid var(--bord);border-radius:12px;padding:12px;}
.qr-block img{width:90px;height:90px;border-radius:8px;flex-shrink:0;}
.qr-text strong{font-size:13px;color:var(--texte);display:block;margin-bottom:4px;}
.qr-text span{font-size:12px;color:var(--texte-s);line-height:1.6;}

/* FRESQUE */
.fresque-page{background:var(--bleu);border-radius:16px;overflow:hidden;margin-bottom:10px;}
.fresque-page img{width:100%;display:block;}
.fresque-caption{padding:16px;text-align:center;}
.fresque-caption h3{font-size:16px;font-weight:600;color:#F5F3EF;margin-bottom:4px;}
.fresque-caption p{font-size:12px;color:var(--sauge);}

.photo-block{border-radius:12px;overflow:hidden;margin:10px 0;border:1px solid var(--bord);}
.photo-block img{width:100%;display:block;}
.photo-block-caption{padding:7px 12px;background:var(--bg-s);font-size:11px;color:var(--texte-t);}

.race-banner{background:var(--moutarde-pale);border:1px solid #DDB87A;border-radius:14px;padding:13px 16px;margin-bottom:10px;display:flex;align-items:flex-start;gap:12px;}
.race-banner i{font-size:21px;color:var(--moutarde);flex-shrink:0;margin-top:1px;}
.race-banner p{font-size:13px;color:#7A4A10;line-height:1.6;}

.footer{text-align:center;margin-top:32px;padding-top:20px;border-top:1px solid var(--bord);}
.footer p{font-size:12px;color:var(--texte-t);line-height:1.7;}
</style>
</head>

function setLang(lang){
  document.getElementById('lang-screen').style.display='none';
  document.getElementById('app').style.display='block';
  document.getElementById('lang-ind').textContent=lang.toUpperCase();
  const d=DATA[lang];
  document.getElementById('rules-bar').innerHTML=d.rules.map(r=>`<div class="rule-pill"><i class="ti ti-check"></i>${r}</div>`).join('');
  document.getElementById('nav-bar').innerHTML=d.nav.map((label,i)=>`<button class="nav-btn${i===0?' active':''}" onclick="show(${i},this)"><div class="nb-wrap"><i class="ti ${d.icons[i]} nb-icon"></i></div><span class="nb-label">${label}</span></button>`).join('');
  document.getElementById('panels').innerHTML=d.panels.map((html,i)=>`<div id="p${i}" class="panel${i===0?' active':''}">${html}</div>`).join('');
}
function resetLang(){document.getElementById('lang-screen').style.display='flex';document.getElementById('app').style.display='none';}
function show(idx,btn){document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));document.getElementById('p'+idx).classList.add('active');btn.classList.add('active');}
</script>
